<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f6f8;
            padding: 40px 20px;
        }
        .resume-box {
            width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #34679e;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 32px;
            color: #222;
        }
        section {
            margin-bottom: 28px;
        }
        h2 {
            font-size:20px;
            color:#34679e;
            border-left:4px solid #34679e;
            padding-left:10px;
            margin-bottom:15px;
        }
        ul {
            padding-left:22px;
            line-height:1.8;
            color:#333;
        }
        .info-row {
            display: flex;
            gap: 60px;
            margin-bottom:8px;
        }
    </style>
</head>
<body>
    <div class="resume-box">
        <div class="header">
            <h1>陈悦琳</h1>
        </div>

        <section>
            <h2>基本信息</h2>
            <div class="info-row">
                <span>籍贯：广东汕头</span>
                <span>居住地：广东珠海</span>
            </div>
            <div class="info-row">
                <span>邮箱：3334869970@qq.com</span>
                <span>电话：19527545126</span>
            </div>
        </section>

        <section>
            <h2>教育背景</h2>
            <ul>
                <li>就读于｜广东科学技术职业学院</li>
            </ul>
        </section>

        <section>
            <h2>项目经历</h2>
            <ul>
                <li>智能助眠系统</li>
            </ul>
        </section>

        <section>
            <h2>竞赛经历</h2>
            <ul>
                <li>中国大学生计算机设计大赛国赛二等奖</li>
                <li>技能大赛校赛一等奖</li>
            </ul>
        </section>

        <section>
            <h2>兴趣爱好</h2>
            <p>听音乐、做饭</p>
        </section>
    </div>
</body>
</html>
